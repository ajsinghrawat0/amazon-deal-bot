name: Amazon deal bot

on:
  # Started every 30 minutes by cron-job.org (GitHub's own schedule was too slow)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      test_telegram:
        description: "Send a test message to the channel"
        type: boolean
        default: false

permissions:
  contents: write             # needed to save state.json back to the repo

concurrency:
  group: deal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check prices and post deals
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          MIN_DROP_PERCENT: "2"
          MIN_DROP_RUPEES: "100"
        run: python deal_bot.py ${{ inputs.test_telegram && '--test' || '' }}

      - name: Save prices for next run
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update prices"
          git pull --rebase origin main
          git push
